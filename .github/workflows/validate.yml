name: Validate v1 Skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-tests:
    name: Behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run behavior tests
        run: npm test

  generated-site-qa:
    name: Generated site QA (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zh-en-all-modules-soft-haze
            languages: zh-CN,en
            modules: projects,writing,about
            fixture: tests/fixtures/site-zh-en
          - name: en-projects-about-paper
            languages: en
            modules: projects,about
            fixture: tests/fixtures/site-en-paper
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Skill dependencies
        run: npm ci

      - name: Generate selected v1 site
        run: >-
          node scripts/new-site.mjs
          --output .tmp/site
          --name "Fixture Person"
          --languages ${{ matrix.languages }}
          --modules ${{ matrix.modules }}
          --site http://localhost:4321
          --base /

      - name: Add evidence-backed fixture
        run: cp -R ${{ matrix.fixture }}/. .tmp/site/

      - name: Install generated site dependencies
        working-directory: .tmp/site
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production and browser verification
        run: node scripts/check-site.mjs --site .tmp/site --browser

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-site-qa-${{ matrix.name }}
          path: .tmp/site/qa
          if-no-files-found: ignore
          retention-days: 14
