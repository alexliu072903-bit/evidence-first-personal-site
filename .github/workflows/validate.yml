name: Validate Skill and Site Foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavior-tests:
    name: Behavior tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run behavior tests
        run: npm test

  browser-qa:
    name: Bilingual browser QA (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: english-primary
            contract: tests/fixtures/bilingual-contract.json
            project: tests/fixtures/bilingual-project.md
            resume: ''
          - name: chinese-primary
            contract: tests/fixtures/chinese-primary-contract.json
            project: tests/fixtures/chinese-primary-project.md
            resume: tests/fixtures/resume-placeholder.pdf
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Skill dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize bilingual fixture
        run: node scripts/init-site.mjs --contract ${{ matrix.contract }} --output .tmp/site

      - name: Add public fixture content
        run: cp ${{ matrix.project }} .tmp/site/src/content/projects/public-service-finder.md

      - name: Add local resume fixture
        if: matrix.resume != ''
        run: |
          mkdir -p .tmp/site/public/resume
          cp ${{ matrix.resume }} .tmp/site/public/resume/mina.pdf

      - name: Install generated site dependencies
        working-directory: .tmp/site
        run: npm install

      - name: Run production and browser verification
        run: node scripts/browser-qa.mjs --site .tmp/site

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-qa-evidence-${{ matrix.name }}
          path: .tmp/site/qa
          if-no-files-found: ignore
          retention-days: 14
